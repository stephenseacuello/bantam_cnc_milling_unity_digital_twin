name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install any requirements files found in the workspace
          find miracle_ws/src -name "requirements.txt" -exec pip install -r {} \; || true

      - name: Run tests
        run: |
          python3 -m pytest miracle_ws/src/ \
            --ignore=miracle_ws/src/miracle_unity_bridge \
            -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check miracle_ws/src/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROS2 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: miracle_ws/docker/Dockerfile.ros2
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
