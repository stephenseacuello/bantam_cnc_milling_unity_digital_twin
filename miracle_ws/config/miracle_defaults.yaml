# MIRACLE Digital Twin — Default Configuration
# Override any value via environment variable: MIRACLE_<SECTION>_<KEY>
# Example: MIRACLE_NETWORK_UNITY_TCP_PORT=10001

network:
  unity_tcp_port: 10000
  websocket_port: 9090
  modbus_port: 502
  opcua_port: 4840
  mqtt_port: 1883
  kafka_port: 9092
  prometheus_port: 9100
  grafana_port: 3001

ros2:
  domain_id: 42
  heartbeat_interval_sec: 0.5
  keepalive_timeout_sec: 10.0
  qos_history_depth: 10

machines:
  ids: "cnc1,cnc2,cnc3"
  default_poll_rate_hz: 10.0

kafka:
  bootstrap_servers: "localhost:9092"
  batch_size: 100
  linger_ms: 100

opcua:
  server_url: "opc.tcp://localhost:4840"
  namespace_index: 2
  security_policy: "None"
  reconnect_base_delay_sec: 1.0
  reconnect_max_delay_sec: 60.0

modbus:
  host: "localhost"
  port: 502
  unit_id: 1

hmi:
  update_rate_hz: 10.0
  enable_commands: false
  max_recent_anomalies: 50

security:
  ids_scan_interval_sec: 5.0
  max_msg_rate_per_node: 1000
  alert_on_unknown_nodes: true

resiliency:
  checkpoint_interval_sec: 30.0
  max_checkpoints: 10

docker:
  ros2_memory_limit: "4g"
  ros2_cpu_limit: "4.0"
