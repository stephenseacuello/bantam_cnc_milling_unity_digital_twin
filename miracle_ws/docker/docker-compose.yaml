# =============================================================================
# MIRACLE Docker Compose Orchestration
# =============================================================================
# Spins up the full MIRACLE stack:
#   - ros2_miracle     : Main ROS2 MIRACLE system
#   - microros_agent   : micro-ROS agent for MCU bridging
#   - dashboard        : Web-based monitoring dashboard
#   - mqtt_broker      : Eclipse Mosquitto MQTT broker
#   - zookeeper        : Apache ZooKeeper (Kafka dependency)
#   - kafka            : Apache Kafka event streaming
#
# Usage:
#   docker compose -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml logs -f
#   docker compose -f docker/docker-compose.yaml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ROS2 MIRACLE -- Main system
  # ---------------------------------------------------------------------------
  ros2_miracle:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    container_name: miracle_ros2
    hostname: miracle-ros2
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOG_DIR=/miracle_ws/log
      - FASTRTPS_DEFAULT_PROFILES_FILE=/miracle_ws/docker/fastdds_profile.xml
      # SROS2 DDS Security (set MIRACLE_SROS2_ENABLED=true for production)
      - MIRACLE_SROS2_ENABLED=${MIRACLE_SROS2_ENABLED:-false}
      - ROS_SECURITY_KEYSTORE=/miracle_ws/security/keystore
      - ROS_SECURITY_ENABLE=${MIRACLE_SROS2_ENABLED:-false}
      - ROS_SECURITY_STRATEGY=${MIRACLE_SROS2_STRATEGY:-Enforce}
    ports:
      - "10000:10000"   # Unity ROS-TCP-Endpoint bridge
      - "9091:9090"     # HMI WebSocket bridge (host 9091 -> container 9090)
    volumes:
      - miracle_data:/miracle_ws/data
      - miracle_logs:/miracle_ws/log
      - miracle_keystore:/miracle_ws/security/keystore:ro
    networks:
      - miracle_net
    depends_on:
      mqtt_broker:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && source /miracle_ws/install/setup.bash && ros2 topic list > /dev/null 2>&1' || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 8G

  # ---------------------------------------------------------------------------
  # micro-ROS Agent -- MCU bridge
  # ---------------------------------------------------------------------------
  microros_agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.microros
    container_name: miracle_microros
    hostname: miracle-microros
    environment:
      - ROS_DOMAIN_ID=42
    ports:
      - "8888:8888/udp"
    networks:
      - miracle_net
    depends_on:
      ros2_miracle:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f micro_ros_agent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Dashboard -- Web monitoring UI
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: miracle_dashboard
    hostname: miracle-dashboard
    ports:
      - "3000:80"
    networks:
      - miracle_net
    depends_on:
      ros2_miracle:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # MQTT Broker -- Eclipse Mosquitto
  # ---------------------------------------------------------------------------
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: miracle_mqtt
    hostname: miracle-mqtt
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - miracle_data:/mosquitto/data
      - miracle_logs:/mosquitto/log
    networks:
      - miracle_net
    environment:
      - MQTT_PASSWORD=${MQTT_PASSWORD:-miracle}
    command: >
      sh -c '
        touch /mosquitto/config/passwd &&
        mosquitto_passwd -b /mosquitto/config/passwd miracle "$${MQTT_PASSWORD}" &&
        echo "listener 1883"              >  /mosquitto/config/mosquitto.conf &&
        echo "listener 9001"              >> /mosquitto/config/mosquitto.conf &&
        echo "protocol websockets"        >> /mosquitto/config/mosquitto.conf &&
        echo "allow_anonymous false"      >> /mosquitto/config/mosquitto.conf &&
        echo "password_file /mosquitto/config/passwd" >> /mosquitto/config/mosquitto.conf &&
        echo "persistence true"           >> /mosquitto/config/mosquitto.conf &&
        echo "persistence_location /mosquitto/data/" >> /mosquitto/config/mosquitto.conf &&
        echo "log_dest file /mosquitto/log/mosquitto.log" >> /mosquitto/config/mosquitto.conf &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
      '
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # ZooKeeper -- Kafka dependency
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: miracle_zookeeper
    hostname: miracle-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - miracle_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Kafka -- Event streaming platform
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: miracle_kafka
    hostname: miracle-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - miracle_net
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # TLS Bridge -- stunnel sidecar for mutual TLS on ROS-TCP-Endpoint
  # ---------------------------------------------------------------------------
  tls_bridge:
    image: alpine/stunnel:latest
    container_name: miracle_tls_bridge
    depends_on:
      - ros_tcp_endpoint
    ports:
      - "10001:10001"
    volumes:
      - ./security/certs:/etc/stunnel/certs:ro
      - ./docker/stunnel.conf:/etc/stunnel/stunnel.conf:ro
    profiles:
      - tls
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus -- Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: miracle_prometheus
    hostname: miracle-prometheus
    ports:
      - "9190:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - miracle_net
    depends_on:
      ros2_miracle:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Grafana -- Dashboards and visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: miracle_grafana
    hostname: miracle-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-miracle}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - miracle_net
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Loki -- Log aggregation
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: miracle_loki
    hostname: miracle-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - miracle_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Promtail -- Log shipping agent
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: miracle_promtail
    hostname: miracle-promtail
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - miracle_net
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# =============================================================================
# Networks
# =============================================================================
networks:
  miracle_net:
    driver: bridge
    name: miracle_net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  miracle_data:
    name: miracle_data
  miracle_logs:
    name: miracle_logs
  kafka_data:
    name: miracle_kafka_data
  zookeeper_data:
    name: miracle_zookeeper_data
  zookeeper_logs:
    name: miracle_zookeeper_logs
  grafana_data:
    name: miracle_grafana_data
  loki_data:
    name: miracle_loki_data
  miracle_keystore:
    name: miracle_keystore
