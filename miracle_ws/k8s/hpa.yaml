# HorizontalPodAutoscaler for ros2-miracle
# Scales between 1-3 replicas based on CPU utilization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ros2-miracle-hpa
  namespace: miracle-system
  labels:
    app.kubernetes.io/part-of: miracle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ros2-miracle
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
