  GRAFANA_ADMIN_PASSWORD: Q0hBTkdFX01FX2dyYWZhbmE=
  # Placeholder: 'CHANGE_ME_mqtt' base64-encoded
  MQTT_PASSWORD: Q0hBTkdFX01FX21xdHQ=
