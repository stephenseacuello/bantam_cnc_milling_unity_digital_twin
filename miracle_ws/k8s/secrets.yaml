# MIRACLE system secrets
# WARNING: Replace placeholder base64 values before deploying to any environment.
# In production, use a secrets manager (e.g., Sealed Secrets, Vault, SOPS) instead
# of storing secrets directly in version control.
#
# To encode a value: echo -n 'your-password' | base64
# To decode a value: echo 'base64string' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: miracle-secrets
  namespace: miracle-system
  labels:
    app.kubernetes.io/part-of: miracle
type: Opaque
data:
