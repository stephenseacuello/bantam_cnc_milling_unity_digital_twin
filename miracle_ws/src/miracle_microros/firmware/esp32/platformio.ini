; =============================================================================
; MIRACLE ESP32 Sensor Bridge - PlatformIO Configuration
; =============================================================================
; Firmware for ESP32-based vibration & current sensor acquisition.
; Connects to the micro-ROS agent over WiFi (UDP transport).
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial monitor --------------------------------------------------------
monitor_speed = 115200

; --- Library dependencies --------------------------------------------------
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git

; --- Build flags -----------------------------------------------------------
; WiFi transport is used for the ESP32 micro-ROS bridge.
; Override MIRACLE_WIFI_SSID and MIRACLE_WIFI_PASSWORD via environment
; variables or a platformio_override.ini file for production deployments.
build_flags =
    ; micro-ROS transport selection
    -D MICRO_ROS_TRANSPORT_ARDUINO_WIFI

    ; micro-ROS agent connection
    -D MIRACLE_AGENT_IP=\"192.168.1.1\"
    -D MIRACLE_AGENT_PORT=8888

    ; WiFi credentials (override in platformio_override.ini for production)
    -D MIRACLE_WIFI_SSID=\"MIRACLE_FACTORY_NET\"
    -D MIRACLE_WIFI_PASSWORD=\"CHANGE_ME_IN_ENV\"

    ; Machine identification
    -D MIRACLE_MACHINE_ID=\"cnc_001\"

    ; ROS 2 domain ID (must match transport_params.yaml)
    -D MIRACLE_ROS_DOMAIN_ID=42

    ; Sensor publish rates (Hz)
    -D MIRACLE_VIBRATION_RATE_HZ=1000
    -D MIRACLE_CURRENT_RATE_HZ=500
    -D MIRACLE_HEARTBEAT_RATE_HZ=1

    ; ADC pin assignments
    -D MIRACLE_PIN_VIBRATION_X=34
    -D MIRACLE_PIN_VIBRATION_Y=35
    -D MIRACLE_PIN_VIBRATION_Z=36
    -D MIRACLE_PIN_CURRENT=39

    ; LED status indicator
    -D MIRACLE_LED_PIN=2

    ; Watchdog timeout (seconds)
    -D MIRACLE_WDT_TIMEOUT_S=10

    ; Compiler optimisation for release builds
    -O2

; --- Upload settings -------------------------------------------------------
upload_speed = 921600

; --- Board configuration overrides -----------------------------------------
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
