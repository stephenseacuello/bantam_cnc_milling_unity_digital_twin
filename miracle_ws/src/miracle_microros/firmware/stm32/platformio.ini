; =============================================================================
; MIRACLE STM32 Sensor Bridge - PlatformIO Configuration
; =============================================================================
; Firmware for STM32 Nucleo F446RE-based temperature, acoustic emission,
; and coolant flow sensor acquisition. Connects to the micro-ROS agent
; over serial (UART) transport.
; =============================================================================

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino

; --- Serial monitor --------------------------------------------------------
monitor_speed = 115200

; --- Library dependencies --------------------------------------------------
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git

; --- Build flags -----------------------------------------------------------
; Serial transport is used for the STM32 micro-ROS bridge.
; The STM32 communicates with the agent via USB-UART at 921600 baud.
build_flags =
    ; micro-ROS transport selection
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL

    ; Serial transport configuration
    -D MIRACLE_SERIAL_BAUDRATE=921600

    ; Machine identification
    -D MIRACLE_MACHINE_ID=\"cnc_001\"

    ; ROS 2 domain ID (must match transport_params.yaml)
    -D MIRACLE_ROS_DOMAIN_ID=42

    ; Sensor publish rates (Hz)
    -D MIRACLE_TEMPERATURE_RATE_HZ=10
    -D MIRACLE_ACOUSTIC_RATE_HZ=1000
    -D MIRACLE_ACOUSTIC_RAW_RATE_HZ=44100
    -D MIRACLE_COOLANT_RATE_HZ=10
    -D MIRACLE_HEARTBEAT_RATE_HZ=1

    ; ADC pin assignments (STM32 naming)
    -D MIRACLE_PIN_TEMPERATURE=PA0
    -D MIRACLE_PIN_ACOUSTIC=PA1
    -D MIRACLE_PIN_COOLANT_FLOW=PA2

    ; LED status indicator (Nucleo onboard LED)
    -D MIRACLE_LED_PIN=LED_BUILTIN

    ; Watchdog timeout (seconds)
    -D MIRACLE_WDT_TIMEOUT_S=10

    ; Acoustic downsampling window size (44100 / 1000 = ~44)
    -D MIRACLE_ACOUSTIC_DOWNSAMPLE_WINDOW=44

    ; Compiler optimisation for release builds
    -O2

; --- Upload settings -------------------------------------------------------
upload_protocol = stlink

; --- Debug settings --------------------------------------------------------
debug_tool = stlink
debug_init_break = tbreak setup
